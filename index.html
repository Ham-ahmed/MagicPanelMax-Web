        for(let i=0;i<bytes.length;i++)bytes[i]^=KEY1;
        const html=new TextDecoder("utf-8").decode(bytes);
        document.open();
        document.write(html);
        document.close();
    }catch(e){
        document.write("<h2 style=\"color:red;text-align:center;margin-top:50px\">خطأ في فك الحماية</h2>");
    }
})();
</script>
